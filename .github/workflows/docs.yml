name: docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      # mkdocs-click imports harald.cli, so the project environment is needed.
      - run: uv run --frozen --with-requirements docs/requirements.txt mkdocs build --strict -f docs/mkdocs.yml
