[project]
name = "harald"
version = "0.1.0"
description = "Personal offline German vocabulary tool"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "click>=8.3,<9",
    "rich>=14",
    "SQLAlchemy>=2.1,<2.2",
    "textual>=8.2,<9",
]

[project.scripts]
harald = "harald.tui.main:main"
harald-cli = "harald.cli:main"

[build-system]
requires = ["uv_build>=0.9.29,<0.10"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest", "ruff", "mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "BLE", "UP"]

[tool.mypy]
strict = true
enable_error_code = ["truthy-bool"]
mypy_path = "src"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
